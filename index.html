<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laporan Warden</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0b0b"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--g:#c9a227;--gd:#8a6a12;--y:#f6e05e;--k:#0b0b0b;--bg:#faf6ea;--b:#e7dcb8;--m:#6b6045}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--k);padding-top:env(safe-area-inset-top)}
header{background:var(--k);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--g);box-shadow:0 2px 10px #0005}
header .lg{width:46px;height:46px;border-radius:10px;flex:none}
header .ht{flex:1;min-width:0}
header h1{font:700 11.5px/1.25 Georgia,serif;letter-spacing:.5px;margin:0;color:var(--y)}
header small{display:block;color:#d9cfa8;font-size:10.5px;margin-top:2px}
header button{background:#1c1c1c;color:var(--y);border:1px solid #4a3f1c;border-radius:10px;width:36px;height:36px;font-size:16px;margin-left:2px}
main{padding:14px 14px 100px}
.tab{display:none}.tab.on{display:block}
.card{background:#fff;border-radius:16px;padding:16px 16px 16px 20px;margin-bottom:12px;border:1px solid var(--b);box-shadow:0 2px 8px #c9a22722;position:relative}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--y),var(--g))}
h2{font:700 17px Georgia,serif;margin:0 0 12px}
label{display:block;font-size:11.5px;font-weight:700;margin:12px 0 5px;color:var(--gd);letter-spacing:.4px;text-transform:uppercase}
input,textarea{width:100%;font:inherit;font-size:15px;padding:12px;border:1px solid var(--b);border-radius:12px;background:#fffdf7;color:var(--k);outline:0}
input:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px #c9a22733}
textarea{min-height:130px;resize:vertical;padding-right:54px}
.wrap{position:relative}
.mic{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--k);color:var(--y);font-size:18px;box-shadow:0 0 0 2px var(--g)}
.mic.on{background:#c62828;color:#fff;animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 8px #c6282833}}
.att{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.att div{background:#fffdf7;border:1px solid var(--b);border-radius:12px;padding:10px;text-align:center}
.att b{font-size:12px;color:var(--gd)}.att span{font-size:11px;color:var(--m);display:block;margin-top:6px}
.att input{text-align:center;padding:8px}
.badge{background:var(--k);color:var(--y);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700;display:inline-block;margin-bottom:12px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--y),var(--g));color:var(--k);margin-top:10px;box-shadow:0 3px 8px #c9a22755}
.btn.dk{background:var(--k);color:var(--y);box-shadow:none}
.btn.lt{background:#fff;color:var(--gd);border:1px solid var(--g);box-shadow:none}
.btn.o{background:#fffdf7;color:var(--gd);border:2px dashed var(--g);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.im{background:#fffdf7;border:1px solid var(--b);border-radius:12px;overflow:hidden}
.im img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.im input{border:0;border-top:1px solid var(--b);border-radius:0;font-size:13px;padding:8px}
.im .ac{display:flex;justify-content:space-between;padding:4px 6px;font-size:12px}
.im .ac button{border:0;background:none;font-size:16px;padding:4px 8px}
canvas{width:100%;height:180px;border:1px solid var(--b);border-radius:12px;background:#fff;touch-action:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--k);border-top:2px solid var(--g);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:10px;color:#9d9577}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--y);font-weight:700}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#000;color:var(--y);border:1px solid var(--g);padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;display:none}
#pv{display:none;position:fixed;inset:0;background:#d9d2b8;z-index:20;overflow:auto}
#pv .bar{position:sticky;top:0;background:var(--k);padding:10px;display:flex;gap:8px;z-index:2;border-bottom:2px solid var(--g)}
#pv .bar button{flex:1;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:700}
#pa{background:#fff;color:#000;margin:10px auto;padding:16px;max-width:800px;font:11px/1.35 system-ui,sans-serif;box-shadow:0 2px 12px #0003}
#pa .lh{display:flex;align-items:center;gap:10px;padding-bottom:6px;border-bottom:3px double #b8912f}
#pa .lh img{width:56px;height:56px;border-radius:8px;flex:none}
#pa .lh div{flex:1;text-align:center}
#pa .lh b{display:block;font:700 13px Georgia,serif;letter-spacing:.4px}
#pa .lh span{display:block;font-size:10px}
#pa .lh i{display:block;font-size:9px;color:#8a6a12;letter-spacing:2px}
#pa h1{font:700 14px Georgia,serif;text-align:center;margin:8px 0 6px;letter-spacing:1px}
#pa h3{font:700 11.5px Georgia,serif;margin:8px 0 3px;color:#8a6a12;border-bottom:1px solid #d4af37;padding-bottom:1px}
#pa table{border-collapse:collapse;width:100%}
#pa td,#pa th{border:1px solid #8a7a3a;padding:2px 5px;text-align:center}
#pa th{background:#fdf3c4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pa td.l{text-align:left}
#pa .ig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#pa .ig div{break-inside:avoid;font-size:9px;line-height:1.2}
#pa .ig img{width:100%;aspect-ratio:4/3;object-fit:cover}
#pa .sg{display:flex;justify-content:space-between;margin-top:12px;break-inside:avoid}
#pa pre{white-space:pre-wrap;font:inherit;margin:0}
#pm{font-size:11px;color:#6b6045;text-align:center;padding:2px}
@page{size:A4;margin:12mm}
@media print{header,main,nav,.toast,#pv .bar,#pm{display:none!important}body{background:#fff;padding:0}#pv{position:static;display:block!important;background:#fff;overflow:visible}#pa{margin:0;max-width:none;box-shadow:none;zoom:var(--z,1);width:calc(186mm / var(--z,1))!important;padding:0!important}}
</style></head><body>
<header><img class="lg" alt=""><div class="ht"><h1>SEKOLAH MENENGAH AGAMA DAERAH BATANG PADANG</h1><small>BIDOR, PERAK · Warden Asrama · v7</small></div><button onclick="demo()" aria-label="Contoh">✨</button><button onclick="resetAll()" aria-label="Reset">↺</button></header>
<main>
<section class="tab on" id="t0"><div class="card"><h2>1 · Maklumat Tugasan</h2>
<label>Tarikh</label><input type="date" id="tarikh">
<label>Masa / Sesi</label><input id="masa" placeholder="8:00 Pagi - 11:00 Malam">
<label>Tempat / Kawasan</label><input id="tempat" placeholder="Kompleks Asrama Lelaki & Surau">
<label>Warden Bertugas</label><input id="warden" placeholder="Ustaz Ahmad Faiz bin Sulaiman"></div></section>

<section class="tab" id="t1"><div class="card"><h2>2 · Kehadiran Pelajar</h2>
<div class="badge" id="jum">Jumlah Kehadiran: 0 / 0</div><div class="att" id="att"></div></div></section>

<section class="tab" id="t2"><div class="card"><h2>3 · Laporan Aktiviti</h2>
<label>Laporan Ringkas Tugasan & Aktiviti</label>
<div class="wrap"><textarea id="laporan" placeholder="Solat berjemaah, prep malam, pemeriksaan dorm..."></textarea><button class="mic" onclick="mic('laporan',this)">🎤</button></div>
<label>Catatan Khas / Tindakan Susulan</label>
<div class="wrap"><textarea id="catatan" style="min-height:90px" placeholder="Pelajar ke klinik, tindakan pembaikan..."></textarea><button class="mic" onclick="mic('catatan',this)">🎤</button></div>
</div></section>

<section class="tab" id="t3"><div class="card"><h2>4 · Gambar <span id="ng" style="font-weight:400;color:#64748b">(0)</span></h2>
<input type="file" id="f" accept="image/*" multiple hidden>
<button class="btn o" onclick="f.click()">📷 Ambil / Pilih Gambar</button>
<div class="grid" id="grid"></div></div></section>

<section class="tab" id="t4"><div class="card"><h2>5 · Tandatangan</h2>
<label>Tandatangan Warden</label><canvas id="sig"></canvas>
<button class="btn lt" style="padding:8px" onclick="clrSig()">Padam tandatangan</button>
<label>Disahkan Oleh (Nama Pengesah)</label><input id="pengesah" placeholder="Ustaz Mohamed Azman bin Ibrahim">
<label>Jawatan Pengesah</label><input id="jawatan" placeholder="Ketua Warden / Penolong Kanan HEM"></div>
<button class="btn" onclick="preview()">🖨️ Pratonton & Cetak</button>
<button class="btn dk" onclick="shareTxt()">📤 Kongsi Teks (WhatsApp)</button>
<button class="btn dk" onclick="dlHtml()">💾 Simpan Laporan (fail HTML)</button>
<button class="btn dk" onclick="genPDF()">📄 Jana PDF 1 Muka & Kongsi</button><button class="btn lt" onclick="refreshApp()">🔄 Muat semula versi terkini</button></section>
</main>
<div id="pv"><div class="bar"><button style="background:linear-gradient(135deg,#f6e05e,#c9a227);color:#000" onclick="window.print()">🖨️ Cetak / Simpan PDF</button><button style="background:#1c1c1c;color:#f6e05e" onclick="$('pv').style.display='none'">✖ Tutup</button></div><div id="pm"></div><div id="pa"></div></div>
<nav id="nav"></nav><div class="toast" id="toast"></div>

$("f").onchange=async e=>{for(const file of e.target.files)imgs.push({src:await shrink(file),cap:""});e.target.value="";draw()};
function shrink(file){return new Promise(r=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const s=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.78))};i.src=u})}

const cv=$("sig");let g,dr=false;
function initSig(){if(cv.width!==cv.clientWidth*2){cv.width=cv.clientWidth*2;cv.height=360;g=cv.getContext("2d");g.lineWidth=4;g.lineCap="round"}}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*2,(e.clientY-r.top)*2]}
cv.onpointerdown=e=>{initSig();dr=true;sigDirty=true;cv.setPointerCapture(e.pointerId);g.beginPath();g.moveTo(...pos(e))};
cv.onpointermove=e=>{if(dr){g.lineTo(...pos(e));g.stroke()}};cv.onpointerup=()=>dr=false;
function clrSig(){initSig();g&&g.clearRect(0,0,cv.width,cv.height);sigDirty=false}

let act=null,base="",tgt=null,web=null;
async function mic(id,btn){
 const SR=P.SpeechRecognition,el=$(id);
 if(act){const was=act===btn;await stopMic();if(was)return}
 act=btn;tgt=el;btn.classList.add("on");base=el.value;
 if(SR&&C.isNativePlatform&&C.isNativePlatform()){
  try{const a=await SR.available();if(!a.available){toast("Pengecam suara tiada pada peranti");return stopMic()}
  const p=await SR.requestPermissions();if(p.speechRecognition!=="granted"){toast("Sila benarkan mikrofon");return stopMic()}
  await SR.removeAllListeners();
  SR.addListener("partialResults",d=>{if(act&&d.matches&&d.matches[0])tgt.value=(base?base+" ":"")+d.matches[0]});
  SR.addListener("listeningState",d=>{if(d.status==="stopped"&&act){base=tgt.value;save();setTimeout(()=>act&&SR.start({language:"ms-MY",partialResults:true,popup:false}).catch(()=>{}),300)}});
  await SR.start({language:"ms-MY",partialResults:true,popup:false})}catch(e){toast("Ralat mikrofon");stopMic()}
 }else{
  const W=window.webkitSpeechRecognition||window.SpeechRecognition;if(!W){toast("Tidak disokong");return stopMic()}
  web=new W();web.lang="ms-MY";web.continuous=true;web.interimResults=true;
  web.onerror=e=>{if(e.error==='not-allowed'){toast('Sila benarkan mikrofon');stopMic()}};web.onresult=e=>{let s="";for(const r of e.results)s+=r[0].transcript;tgt.value=(base?base+" ":"")+s};
  web.onend=()=>{if(act){base=tgt.value;try{web.start()}catch(e){}}};web.start()}
}
async function stopMic(){const b=act;act=null;b&&b.classList.remove("on");try{P.SpeechRecognition&&await P.SpeechRecognition.stop()}catch(e){}try{web&&web.stop()}catch(e){}save()}
